<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <title>Schéma cinématique plan du bras MaxPID (redessiné en 2026), θ = 40°</title>
  <rect width="760" height="520" fill="#ffffff"/>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <!-- échelle : 2,4 px/mm ; O = (120, 420) ; A = O + a·x1 ; B = O + b·y1 -->
  <!-- A = (286.8, 420) ; B = (120, 223.2) ; C = A + c(cos40, sin40) = (433.9, 296.6) -->
  <!-- axes -->
  <line x1="120" y1="420" x2="700" y2="420" stroke="#444" stroke-width="1.2" marker-end="url(#fl)"/>
  <text x="704" y="436" fill="#444">x₁</text>
  <line x1="120" y1="420" x2="120" y2="60" stroke="#444" stroke-width="1.2" marker-end="url(#fl)"/>
  <text x="96" y="66" fill="#444">y₁</text>

  <!-- bâti (noir) -->
  <polyline points="120,223.2 120,420 286.8,420" fill="none" stroke="#111" stroke-width="5"/>
  <g stroke="#111" stroke-width="1.5">
    <line x1="270" y1="440" x2="304" y2="440"/><line x1="274" y1="440" x2="266" y2="450"/><line x1="284" y1="440" x2="276" y2="450"/><line x1="294" y1="440" x2="286" y2="450"/><line x1="304" y1="440" x2="296" y2="450"/>
  </g>

  <!-- corps moteur 2 (bleu) : pivot en B, direction B→C -->
  <!-- direction BC : (313.9, 73.4) norm 322.4 -> u = (0.9737, 0.2277) -->
  <line x1="120" y1="223.2" x2="227" y2="248.2" stroke="#2b5fb0" stroke-width="6"/>
  <rect x="180" y="225" width="70" height="26" fill="#ffffff" stroke="#2b5fb0" stroke-width="3" transform="rotate(13.16 215 238)"/>
  <text x="168" y="208" fill="#2b5fb0" font-weight="600">2 : moteur</text>

  <!-- vis 3 (rouge) : de B vers C -->
  <line x1="200" y1="241.9" x2="400" y2="288.7" stroke="#c8102e" stroke-width="3.5"/>
  <text x="140" y="300" fill="#c8102e" font-weight="600">3 : vis (p = 4 mm/tr)</text>

  <!-- écrou 4 (vert) -->
  <rect x="352" y="268" width="56" height="26" fill="#ffffff" stroke="#2e8b3a" stroke-width="3" transform="rotate(13.16 380 281)"/>
  <line x1="398" y1="284" x2="433.9" y2="296.6" stroke="#2e8b3a" stroke-width="5"/>
  <text x="352" y="252" fill="#2e8b3a" font-weight="600">4 : écrou</text>

  <!-- bras 5 (orange) : A → C prolongé -->
  <line x1="286.8" y1="420" x2="509" y2="233.5" stroke="#e08a00" stroke-width="7" stroke-linecap="round"/>
  <text x="470" y="352" fill="#b36b00" font-weight="600">5 : bras</text>

  <!-- pivots -->
  <circle cx="120" cy="223.2" r="10" fill="#fff" stroke="#2b5fb0" stroke-width="3.5"/>
  <circle cx="286.8" cy="420" r="10" fill="#fff" stroke="#e08a00" stroke-width="3.5"/>
  <circle cx="433.9" cy="296.6" r="10" fill="#fff" stroke="#2e8b3a" stroke-width="3.5"/>

  <!-- angle θ -->
  <path d="M 356.8 420 A 70 70 0 0 0 340.4 375" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="362" y="398" font-size="18" fill="#111">θ</text>

  <!-- étiquettes -->
  <text x="100" y="440" font-weight="600">O</text>
  <text x="276" y="470" font-weight="600">A</text>
  <text x="92" y="218" font-weight="600">B</text>
  <text x="444" y="318" font-weight="600">C</text>

  <!-- cotes -->
  <g fill="#555" font-size="13">
    <text x="140" y="408">a = OA = 69,5 mm</text>
    <text x="28" y="330">b = OB</text>
    <text x="28" y="347">= 82 mm</text>
    <text x="372" y="372">c = AC = 80 mm</text>
    <text x="248" y="180">x = BC (variable)</text>
  </g>
  <text x="380" y="500" text-anchor="middle" font-size="12" fill="#555">Schéma plan minimal, une couleur par classe d'équivalence (dessiné pour θ = 40°)</text>
</svg>
